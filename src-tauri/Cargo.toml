[package]
name = "programmable-notes"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
serde_json = "1"
preview-policy = { path = "../native-policy" }
native-documents = { path = "../native-documents" }
tauri-plugin-dialog = "=2.8.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
security-test = []

[patch.crates-io]
wry = { path = "vendor/wry" }
