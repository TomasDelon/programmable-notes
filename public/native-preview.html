<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Unprivileged preview</title>
    <style>
      iframe {
        width: 100%;
        height: 95vh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      title="Document preview"
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
