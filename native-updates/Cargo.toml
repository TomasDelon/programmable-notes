[package]
name = "native-updates"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "=0.23.1"
futures-util = "=0.3.34"
minisign-verify = "=0.3.0"
preview-policy = { path = "../native-policy" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["time", "rt", "macros", "sync"] }
uuid = { version = "=1.29.3", features = ["v4"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
