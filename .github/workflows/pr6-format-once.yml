name: PR6 recovered formatting (temporary read-only)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-source:
    if: github.head_ref == 'recovery/two-mode-inline-latex-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate formatting payload (no repository writes)
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          paths=(
            docs/recovery/2026-11-23-source-preview-inline-math.md
            src/editor/rendered/RenderedEditor.tsx
            src/web/WebApp.tsx
            tests/e2e/web-live.spec.ts
            tests/e2e/web-rendered-editor.spec.ts
          )
          npx prettier --write "${paths[@]}"
          git diff --check
          for path in "${paths[@]}"; do
            printf 'PN_FORMAT_BEGIN %s\n' "$path"
            base64 -w 4000 "$path"
            printf '\nPN_FORMAT_END %s\n' "$path"
            sha256sum "$path" | sed 's/^/PN_SHA256 /'
          done
