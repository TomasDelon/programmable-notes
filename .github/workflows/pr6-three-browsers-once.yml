name: PR6 focused three-browser QA (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  three-browser-qa:
    if: github.head_ref == 'recovery/two-mode-inline-latex-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies and three browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Build from exact PR source
        run: npm run build
      - name: Test changed browser specs in Chromium, Firefox and WebKit
        env:
          PN_ALL_BROWSERS: '1'
          CI: '1'
          PLAYWRIGHT_WORKERS: '2'
        run: |
          npx playwright test \
            tests/e2e/web-inspector-layout.spec.ts \
            tests/e2e/web-live-blocks.spec.ts \
            tests/e2e/web-live.spec.ts \
            tests/e2e/web-rendered-editor.spec.ts \
            tests/e2e/web-workspace.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: pr6-three-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
