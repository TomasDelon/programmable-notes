name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate preview runtime for tests
        run: npm run prepare:runtime
      - run: npm run check
      - name: Install walkthrough encoder
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Capture the browser walkthrough
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 --strictPort > /tmp/editor-demo-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4188/ -o /dev/null
          node scripts/demo-editor.mjs
          ffmpeg -loglevel error -framerate 1/2 -pattern_type glob -i '.cache/editor-demo/0*.png' -vf 'scale=1200:-2,format=yuv420p' -r 24 -movflags +faststart .cache/editor-demo/walkthrough.mp4
          tar -czf .cache/editor-demo/browser-build.tar.gz -C dist .
          printf '%s\n' 'Extract browser-build.tar.gz and serve that directory over HTTP with python3 -m http.server 8000 --bind 127.0.0.1. Open http://127.0.0.1:8000 in Chromium.' > .cache/editor-demo/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: playable-editor-demo
          path: .cache/editor-demo/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  native-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path native-policy/Cargo.toml -- --check
      - run: cargo test --manifest-path native-policy/Cargo.toml --locked
      - run: cargo fmt --manifest-path native-documents/Cargo.toml -- --check
      - run: cargo test --manifest-path native-documents/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol,security-test --locked
      - run: npm run native:wry:verify
      - run: npm run native:package
      - name: Inspect production package (does not claim runtime validation)
        run: node scripts/verify-linux-package.mjs "src-tauri/target/release/bundle/deb/Programmable Notes_0.1.0_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-testing-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
