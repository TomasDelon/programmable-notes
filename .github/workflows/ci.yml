name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_qa:
        description: Run all browser tests in Chromium, Firefox and WebKit without a duplicate native build
        type: boolean
        default: false
      review_artifacts:
        description: Capture browser walkthrough and upload testing artifacts
        type: boolean
        default: false
      editing_qa:
        description: Run repeatable Preview input diagnostics only; does not replace mandatory PR checks
        type: boolean
        default: false
      editing_core_only:
        description: Limit optional repeated diagnostics to core-plugin and source-selection cases
        type: boolean
        default: false
      editing_browser:
        description: Browser for the optional Preview input diagnostics
        type: choice
        default: all
        options: [all, firefox, webkit, chromium]
      deployment_url:
        description: HTTPS root URL for deployed web acceptance only (no native build)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url && 'deployment' || 'build' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || (!inputs.deployment_url && !inputs.editing_qa)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_qa && 45 || 15 }}
    env:
      PN_ALL_BROWSERS: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_qa && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin the repository npm version
        run: npm install --global npm@11.9.0
      - name: Scan complete history and archived sources for credentials
        run: bash scripts/scan-secrets.sh
      - name: Verify the secret scanner refuses a synthetic key
        run: PN_GITLEAKS_BIN="$PWD/.cache/security-tools/gitleaks" node --test tests/tooling/secret-scan.test.mjs
      - run: npm ci
      - name: Install matching browser dependencies
        run: |
          if [ "$PN_ALL_BROWSERS" = 1 ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Generate preview runtime for tests
        run: npm run prepare:runtime
      - run: npm run check
      - name: Capture the browser walkthrough
        if: github.event_name == 'workflow_dispatch' && inputs.review_artifacts
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 --strictPort > /tmp/editor-demo-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4188/ -o /dev/null
          node scripts/demo-editor.mjs
          python3 scripts/package-review-demo.py
          python3 scripts/verify-review-demo.py --browser
          python3 -m zipfile -e .cache/review-demo.zip .cache/review-demo-unpacked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.review_artifacts
        with:
          name: playable-editor-demo
          path: .cache/review-demo-unpacked/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.browser_qa)
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  native-check:
    if: github.event_name != 'workflow_dispatch' || (!inputs.browser_qa && !inputs.deployment_url && !inputs.editing_qa)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Pin the repository npm version
        run: npm install --global npm@11.9.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - name: Install native dependencies with bounded network retries
        shell: bash
        run: |
          echo '::add-matcher::.github/apt-problem-matcher.json'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          echo '::remove-matcher owner=programmable-notes-apt::'
      - run: npm ci
      - run: npm run native:wry:verify
      - run: npm run native:package
      - name: Inspect production package (does not claim runtime validation)
        run: node scripts/verify-linux-package.mjs "src-tauri/target/release/bundle/deb/Programmable Notes_0.1.0_amd64.deb"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path native-policy/Cargo.toml -- --check
      - run: cargo test --manifest-path native-policy/Cargo.toml --locked
      - run: cargo fmt --manifest-path native-documents/Cargo.toml -- --check
      - run: cargo test --manifest-path native-documents/Cargo.toml --locked
      - name: Verify recovery and original Save under real ENOSPC on a disposable tmpfs
        shell: bash
        run: |
          pn_recovery_fs=$(mktemp -d)
          sudo mount -t tmpfs -o "size=2M,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$pn_recovery_fs"
          trap 'sudo umount "$pn_recovery_fs"; rmdir "$pn_recovery_fs"' EXIT
          PN_RECOVERY_SMALL_FS="$pn_recovery_fs" cargo test --manifest-path native-documents/Cargo.toml --locked --test snapshots -- --ignored --exact real_enospc_preserves_previous_snapshot --nocapture | tee /tmp/recovery-enospc.log
          grep -F 'test real_enospc_preserves_previous_snapshot ... ok' /tmp/recovery-enospc.log
          PN_DOCUMENT_SMALL_FS="$pn_recovery_fs" timeout -k 5s 30s cargo test --manifest-path native-documents/Cargo.toml --locked --test save_enospc -- --ignored --exact real_enospc_preserves_original_save_and_grant --nocapture | tee /tmp/document-save-enospc.log
          grep -F 'REAL_DOCUMENT_SAVE_ENOSPC_PASS actual_errno=ENOSPC ' /tmp/document-save-enospc.log
      - name: Verify recovery after real writer process crashes
        shell: bash
        run: |
          cargo build --manifest-path native-documents/Cargo.toml --locked --example recovery-crash-writer
          PN_CRASH_WRITER_BINARY="$PWD/native-documents/target/debug/examples/recovery-crash-writer" timeout -k 5s 90s cargo test --manifest-path native-documents/Cargo.toml --locked --test process_crash -- --ignored --exact process_crashes_preserve_durable_recovery_at_each_publication_stage --nocapture | tee /tmp/recovery-crash.log
          grep -F 'REAL_PROCESS_CRASH_PASS stage=durable' /tmp/recovery-crash.log
      - name: Verify original document Save across real writer crashes
        shell: bash
        run: |
          cargo build --manifest-path native-documents/Cargo.toml --locked --example document-save-crash-writer
          PN_SAVE_CRASH_WRITER_BINARY="$PWD/native-documents/target/debug/examples/document-save-crash-writer" timeout -k 5s 90s cargo test --manifest-path native-documents/Cargo.toml --locked --test save_crash -- --ignored --exact actual_save_crashes_preserve_complete_document_and_permissions --nocapture | tee /tmp/document-save-crash.log
          for stage in write synced published durable; do
            grep -F "REAL_DOCUMENT_SAVE_CRASH_PASS stage=$stage " /tmp/document-save-crash.log
          done
      - name: Verify original Save sync error reporting (external syscall injection)
        shell: bash
        run: |
          PN_SAVE_CRASH_WRITER_BINARY="$PWD/native-documents/target/debug/examples/document-save-crash-writer" timeout -k 5s 90s cargo test --manifest-path native-documents/Cargo.toml --locked --test save_crash -- --ignored --exact injected_sync_errors_preserve_original_and_report_publication --nocapture | tee /tmp/document-save-sync-errors.log
          grep -F 'INJECTED_DOCUMENT_SYNC_ERROR_PASS stage=file ' /tmp/document-save-sync-errors.log
          grep -F 'INJECTED_DOCUMENT_SYNC_ERROR_PASS stage=directory ' /tmp/document-save-sync-errors.log
      - name: Verify recovery sync error reporting (external syscall injection)
        shell: bash
        run: |
          PN_CRASH_WRITER_BINARY="$PWD/native-documents/target/debug/examples/recovery-crash-writer" timeout -k 5s 90s cargo test --manifest-path native-documents/Cargo.toml --locked --test process_crash -- --ignored --exact sync_failures_preserve_recovery_and_report_publication_state --nocapture | tee /tmp/recovery-sync-errors.log
          grep -F 'INJECTED_SYNC_ERROR_PASS stage=file ' /tmp/recovery-sync-errors.log
          grep -F 'INJECTED_SYNC_ERROR_PASS stage=publication ' /tmp/recovery-sync-errors.log
          grep -F 'INJECTED_SYNC_ERROR_PASS stage=retention ' /tmp/recovery-sync-errors.log
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release --features custom-protocol,security-test --locked
      # Native installers remain local to this job until their complete native
      # redistribution notice inventory is implemented. Build/inspection stay mandatory.

  deployment-check:
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PN_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      PN_ALL_BROWSERS: ${{ inputs.browser_qa && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate the requested HTTPS origin
        run: node --input-type=module -e "import {deploymentOrigin} from './scripts/cloudflare-config.ts'; console.log('Checking', deploymentOrigin(process.env.PN_DEPLOYMENT_URL))"
      - name: Pin the repository npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Install matching browser dependencies
        run: |
          if [ "$PN_ALL_BROWSERS" = 1 ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Validate the actual deployed app in fresh browser profiles
        run: npx playwright test --config playwright.cloudflare.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloudflare-deployment-check
          path: |
            playwright-report/cloudflare/
            test-results/cloudflare/
          retention-days: 7

  # Optional, explicitly named diagnostics. Pull requests still run the complete
  # check/native-check gates above; success here is never a substitute for them.
  preview-input-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.editing_qa
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PN_ALL_BROWSERS: '1'
      PN_EDITING_BROWSER: ${{ inputs.editing_browser }}
      PN_EDITING_CORE_ONLY: ${{ inputs.editing_core_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin the repository npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Install the requested matching browsers
        run: |
          case "$PN_EDITING_BROWSER" in
            all) npx playwright install --with-deps chromium firefox webkit ;;
            chromium|firefox|webkit) npx playwright install --with-deps "$PN_EDITING_BROWSER" ;;
            *) exit 1 ;;
          esac
      - run: npm run build
      - name: Repeat real keyboard, math, notifications and recovery without retries
        run: |
          browser_args=()
          if [ "$PN_EDITING_BROWSER" != all ]; then
            browser_args=(--project "$PN_EDITING_BROWSER")
          fi
          test_files=(tests/e2e/web-rendered-editor.spec.ts tests/e2e/web-update.spec.ts tests/e2e/web-live.spec.ts tests/e2e/web-math-composition.spec.ts tests/e2e/web-core-plugins.spec.ts)
          grep_args=(--grep 'Markdown keyboard authoring|minimal error notifications|excessive whitespace|work-budget refusal|real service worker update|caret math is ordinary|display math reveals|moving between equations|normal document flow|math composition|blurred composition|invalid LaTeX stays red|setup is invisible|core plugins can be disabled|disabled mathematics stays literal|preview messages cannot change|hidden setup survives|core plugin settings remain usable|unfinished display dollars|removing a dollar|typing a first dollar|literal mathematics work budget')
          if [ "$PN_EDITING_CORE_ONLY" = true ]; then
            test_files=(tests/e2e/web-core-plugins.spec.ts)
            grep_args=()
          fi
          npx playwright test "${test_files[@]}" "${browser_args[@]}" "${grep_args[@]}" --repeat-each=3 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preview-input-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 7
